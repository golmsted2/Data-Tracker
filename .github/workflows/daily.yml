name: Daily basketball pipeline

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the prior scoreboard date
        run: python src/pipeline.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit daily data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data config/teams.csv
          git diff --cached --quiet || git commit -m "data: update basketball tracker"
          git push

