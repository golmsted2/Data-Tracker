name: Live basketball updates

on:
  schedule:
    # Poll every 15 minutes so late-night and daytime games use one reliable schedule.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basketball-data
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll the current scoreboard
        run: python src/pipeline.py --live
      - name: Commit changed live data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No completed-game changes to commit."
            exit 0
          fi
          git commit -m "data: live basketball update"
          git push
